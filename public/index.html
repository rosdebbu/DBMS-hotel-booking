<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMyStay - Hotel Bookings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: '#008cff',
                        primaryDark: '#0070cc',
                    }
                }
            }
        }
    </script>
    <style>
        /* Minimal custom styling mapping dynamic badges if needed */
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased min-h-screen font-sans">
    
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white shadow-sm px-6 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold text-primary flex items-center gap-2">
            🏨 EaseMyStay
        </div>
        <ul class="flex gap-8 text-sm font-semibold text-gray-600 items-center">
            <li><a href="#rooms" onclick="fetchRooms()" class="hover:text-primary transition-colors cursor-pointer">Find Stays</a></li>
            <li><a href="#guests" onclick="fetchReservations()" class="hover:text-primary transition-colors cursor-pointer">My Bookings</a></li>
            <li><a href="admin.html" class="text-xs bg-slate-800 text-white px-3 py-1.5 rounded-md hover:bg-primary transition-all">🔒 Admin Access</a></li>
        </ul>
    </nav>

    <!-- Hero -->
    <header class="relative h-[350px] flex flex-col justify-center items-center text-center text-white bg-gray-900 overflow-hidden">
        <div class="absolute inset-0 bg-black/50 z-10"></div>
        <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1600&q=80" alt="Resort" class="absolute inset-0 w-full h-full object-cover">
        <div class="relative z-20 px-4">
            <h1 class="text-5xl font-bold mb-4 drop-shadow-md">Book Your Perfect Stay</h1>
            <p class="text-lg font-light drop-shadow-md">Over 90% of our rooms are rated 5-stars by guests like you.</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto -mt-10 px-4 relative z-30 pb-20">
        
        <!-- Room Listing View -->
        <section id="rooms-view">
            <div class="flex flex-col gap-6" id="rooms-grid">
                <!-- Rooms injected here by JS -->
            </div>
        </section>

        <!-- Reservations View -->
        <section id="guests-view" class="hidden">
            <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-6">
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <h2 class="text-2xl font-bold text-gray-800">Recent Trips & Bookings</h2>
                    <input type="text" id="booking-search" placeholder="Search by Guest Name..." onkeyup="filterBookings()" class="w-72 px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all">
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 uppercase text-xs tracking-wider">
                                <th class="p-4 font-bold">Guest Name</th>
                                <th class="p-4 font-bold">Room Type</th>
                                <th class="p-4 font-bold">Check In</th>
                                <th class="p-4 font-bold">Check Out</th>
                            </tr>
                        </thead>
                        <tbody id="reservations-body" class="divide-y divide-gray-100 text-sm">
                            <!-- Reservations injected here by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Booking & Payment Modal -->
    <div id="booking-modal" class="modal fixed inset-0 z-[1000] items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-lg p-8 shadow-[0_20px_60px_rgba(0,0,0,0.3)] transform transition-all relative overflow-hidden">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-800 text-3xl leading-none">&times;</button>
            
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-primary">Secure Booking</h2>
                <h4 class="text-gray-500 font-medium mt-1">Room <span id="modal-room-id"></span> • <span id="modal-room-price" class="text-gray-800 font-semibold"></span></h4>
            </div>
            
            <form id="booking-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Full Name (Lead Guest)</label>
                    <input type="text" id="name" placeholder="E.g. Rahul Sharma" required class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                
                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Mobile Number</label>
                        <input type="text" id="phone" placeholder="10-digit mobile" required class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Email Address</label>
                        <input type="email" id="email" placeholder="email@domain.com" required class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
                    </div>
                </div>

                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Traveler ID Proof</label>
                        <select id="id_proof" required class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
                            <option value="Aadhar">Aadhar Card</option>
                            <option value="PAN">PAN Card</option>
                            <option value="Passport">Passport</option>
                        </select>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-sm font-semibold text-gray-600 mb-1">City / Address</label>
                        <input type="text" id="address" placeholder="E.g. Bangalore" required class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
                    </div>
                </div>

                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Check In Date</label>
                        <input type="date" id="check_in" required class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none text-gray-700">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Check Out Date</label>
                        <input type="date" id="check_out" required class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none text-gray-700">
                    </div>
                </div>
                
                <div class="border-t border-gray-200 my-6 pt-4">
                    <h3 class="text-lg font-bold text-gray-800 mb-3">Payment Details</h3>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Select Payment Mode</label>
                        <select id="payment_method" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none font-medium text-gray-700">
                            <option value="Card">💳 Credit/Debit Card (Instant)</option>
                            <option value="UPI">📱 UPI (Google Pay, PhonePe)</option>
                            <option value="NetBanking">🏦 Net Banking</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="w-full py-3 bg-primary hover:bg-primaryDark transition-colors text-white font-bold rounded-lg shadow-md hover:shadow-lg disabled:bg-gray-400 disabled:shadow-none">
                    Pay & Confirm Booking
                </button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
